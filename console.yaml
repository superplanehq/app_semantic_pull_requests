---
apiVersion: v1
kind: Console
metadata:
  canvasId: 95fd1b27-f905-48cc-aff1-43972d5754db
  name: app-semantic-pull-requests
spec:
  layout:
  - h: 3
    i: setup-panel
    minH: 2
    minW: 2
    w: 4
    x: 0
    "y": 0
  - h: 2
    i: kpi-total
    minH: 2
    minW: 2
    w: 4
    x: 0
    "y": 3
  - h: 2
    i: kpi-feat
    minH: 2
    minW: 2
    w: 4
    x: 0
    "y": 5
  - h: 2
    i: kpi-fix
    minH: 2
    minW: 2
    w: 4
    x: 0
    "y": 7
  - h: 2
    i: kpi-docs
    minH: 2
    minW: 2
    w: 4
    x: 0
    "y": 9
  - h: 2
    i: kpi-chore
    minH: 2
    minW: 2
    w: 4
    x: 0
    "y": 11
  - h: 2
    i: kpi-invalid
    minH: 2
    minW: 2
    w: 4
    x: 0
    "y": 13
  - h: 15
    i: chart-merges-by-week
    minH: 4
    minW: 5
    w: 8
    x: 4
    "y": 0
  panels:
  - content:
      node: Setup
      showRun: true
      title: Setup
    id: setup-panel
    type: node
  - content:
      dataSource:
        kind: memory
        namespace: semanticPrWeeklyStats
      render:
        aggregation: sum
        field: total
        kind: number
      title: Total
    id: kpi-total
    type: number
  - content:
      dataSource:
        kind: memory
        namespace: semanticPrWeeklyStats
      render:
        aggregation: sum
        field: feat
        kind: number
      title: feat
    id: kpi-feat
    type: number
  - content:
      dataSource:
        kind: memory
        namespace: semanticPrWeeklyStats
      render:
        aggregation: sum
        field: fix
        kind: number
      title: fix
    id: kpi-fix
    type: number
  - content:
      dataSource:
        kind: memory
        namespace: semanticPrWeeklyStats
      render:
        aggregation: sum
        field: docs
        kind: number
      title: docs
    id: kpi-docs
    type: number
  - content:
      dataSource:
        kind: memory
        namespace: semanticPrWeeklyStats
      render:
        aggregation: sum
        field: chore
        kind: number
      title: chore
    id: kpi-chore
    type: number
  - content:
      dataSource:
        kind: memory
        namespace: semanticPrWeeklyStats
      render:
        aggregation: sum
        field: invalid
        kind: number
      title: invalid
    id: kpi-invalid
    type: number
  - content:
      dataSource:
        kind: memory
        namespace: semanticPrWeeklyStats
      render:
        kind: chart
        legend: show
        limit: 52
        series:
        - color: "#fde68a"
          field: docs
          label: docs
        - color: "#22c55e"
          field: feat
          label: feat
        - color: "#f87171"
          field: fix
          label: fix
        - color: "#fbbf24"
          field: chore
          label: chore
        - color: "#9ca3af"
          field: invalid
          label: invalid
        sort:
          field: week
          order: asc
        type: stacked-bar
        xField: '{{ "W" + string(week) }}'
      title: Merged by week
    id: chart-merges-by-week
    type: chart
