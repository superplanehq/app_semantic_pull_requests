---
apiVersion: v1
kind: Console
metadata:
  canvasId: 95fd1b27-f905-48cc-aff1-43972d5754db
  name: app-semantic-pull-requests
spec:
  panels:
  - id: setup-panel
    type: node
    content:
      node: Setup
      showRun: true
      title: Setup
  - id: kpi-total
    type: number
    content:
      dataSource:
        kind: memory
        namespace: semanticPrWeeklyStats
      render:
        aggregation: sum
        field: total
        kind: number
      title: Total
  - id: kpi-feat
    type: number
    content:
      dataSource:
        kind: memory
        namespace: semanticPrWeeklyStats
      render:
        aggregation: sum
        field: feat
        kind: number
      title: feat
  - id: kpi-fix
    type: number
    content:
      dataSource:
        kind: memory
        namespace: semanticPrWeeklyStats
      render:
        aggregation: sum
        field: fix
        kind: number
      title: fix
  - id: kpi-docs
    type: number
    content:
      dataSource:
        kind: memory
        namespace: semanticPrWeeklyStats
      render:
        aggregation: sum
        field: docs
        kind: number
      title: docs
  - id: kpi-chore
    type: number
    content:
      dataSource:
        kind: memory
        namespace: semanticPrWeeklyStats
      render:
        aggregation: sum
        field: chore
        kind: number
      title: chore
  - id: kpi-invalid
    type: number
    content:
      dataSource:
        kind: memory
        namespace: semanticPrWeeklyStats
      render:
        aggregation: sum
        field: invalid
        kind: number
      title: invalid
  - id: chart-merges-by-week
    type: chart
    content:
      dataSource:
        kind: memory
        namespace: semanticPrWeeklyStats
      render:
        kind: chart
        legend: show
        limit: 52
        series:
        - color: "#fde68a"
          field: docs
          label: docs
        - color: "#22c55e"
          field: feat
          label: feat
        - color: "#f87171"
          field: fix
          label: fix
        - color: "#fbbf24"
          field: chore
          label: chore
        - color: "#9ca3af"
          field: invalid
          label: invalid
        sort:
          field: week
          order: asc
        type: stacked-bar
        xField: '{{ "W" + string(week) }}'
      title: Merged by week
  layout:
  - i: setup-panel
    x: 0
    "y": 0
    w: 4
    h: 3
    minW: 2
    minH: 2
  - i: kpi-total
    x: 0
    "y": 3
    w: 4
    h: 2
    minW: 2
    minH: 2
  - i: kpi-feat
    x: 0
    "y": 5
    w: 4
    h: 2
    minW: 2
    minH: 2
  - i: kpi-fix
    x: 0
    "y": 7
    w: 4
    h: 2
    minW: 2
    minH: 2
  - i: kpi-docs
    x: 0
    "y": 9
    w: 4
    h: 2
    minW: 2
    minH: 2
  - i: kpi-chore
    x: 0
    "y": 11
    w: 4
    h: 2
    minW: 2
    minH: 2
  - i: kpi-invalid
    x: 0
    "y": 13
    w: 4
    h: 2
    minW: 2
    minH: 2
  - i: chart-merges-by-week
    x: 4
    "y": 0
    w: 8
    h: 15
    minW: 5
    minH: 4
