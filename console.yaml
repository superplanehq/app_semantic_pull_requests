---
apiVersion: v1
kind: Console
metadata:
  canvasId: 95fd1b27-f905-48cc-aff1-43972d5754db
  name: app-semantic-pull-requests
spec:
  panels:
  - id: kpi-merged-this-week
    type: number
    content:
      dataSource:
        kind: memory
        namespace: semanticPrMerges
      render:
        aggregation: count
        kind: number
        label: this year
      title: Merged PRs
  - id: chart-merges-by-title
    type: chart
    content:
      dataSource:
        kind: memory
        namespace: semanticPrMerges
      render:
        kind: chart
        legend: hide
        limit: 15
        series:
        - label: Merges
        type: bar
        xField: title
      title: By title
  - id: merged-prs-table
    type: table
    content:
      dataSource:
        kind: memory
        namespace: semanticPrMerges
      render:
        columns:
        - field: pr_number
          label: PR
        - field: title
          label: Title
        - field: type
          format: badge
          label: Type
        - field: merged_at
          format: relative
          label: Merged
        kind: table
        sort:
          field: merged_at
          order: desc
      title: All merges
  layout:
  - i: kpi-merged-this-week
    x: 0
    "y": 0
    w: 3
    h: 8
    minW: 2
    minH: 2
  - i: chart-merges-by-title
    x: 3
    "y": 0
    w: 9
    h: 8
    minW: 5
    minH: 4
  - i: merged-prs-table
    x: 0
    "y": 8
    w: 12
    h: 6
    minW: 6
    minH: 4
