---
apiVersion: v1
kind: Canvas
metadata:
  description: Validate semantic pull request titles and track weekly merge statistics
    by type.
  id: 95fd1b27-f905-48cc-aff1-43972d5754db
  isTemplate: false
  name: app-semantic-pull-requests
  organizationId: 3ee1aa47-3a60-4c1f-b645-0b9859ab91f8
spec:
  changeManagement:
    approvals:
    - type: TYPE_ANYONE
  edges:
  - channel: passed
    sourceId: fetch-weekly-stats
    targetId: import-weekly-stats
  - channel: default
    sourceId: filter-merged
    targetId: prepare-weekly-merge
  - channel: passed
    sourceId: prepare-weekly-merge
    targetId: read-weekly-stat
  - channel: found
    sourceId: read-weekly-stat
    targetId: runnerjs-bump-weekly-stat-27827c
  - channel: notFound
    sourceId: read-weekly-stat
    targetId: runnerjs-bump-weekly-stat-27827c
  - channel: passed
    sourceId: runnerjs-bump-weekly-stat-27827c
    targetId: upsert-weekly-stat
  - channel: 'true'
    sourceId: if-should-comment
    targetId: comment-failure
  - channel: 'true'
    sourceId: if-should-enforce
    targetId: if-title-valid
  - channel: 'false'
    sourceId: if-title-valid
    targetId: publish-failure-status
  - channel: 'true'
    sourceId: if-title-valid
    targetId: publish-success-status
  - channel: default
    sourceId: publish-failure-status
    targetId: if-should-comment
  - channel: default
    sourceId: trigger-on-pull-request
    targetId: validate-title
  - channel: default
    sourceId: trigger-setup
    targetId: fetch-weekly-stats
  - channel: passed
    sourceId: validate-title
    targetId: filter-merged
  - channel: passed
    sourceId: validate-title
    targetId: if-should-enforce
  nodes:
  - component: runnerJS
    configuration:
      enable_setup_commands: false
      execution_mode: host
      execution_timeout_seconds: 60
      machine_type: e1-tiny-amd64
      script: |
        const ALL_TYPES = [
          "feat", "fix", "docs", "chore", "invalid",
        ];

        function main() {
          const prep = $["Prepare weekly merge"].data.result || {};
          const week = prep.week;
          const type = prep.type || "invalid";
          const existing = ($["Read weekly stat"].data.values[0] || {});

          const row = { week: week, total: 0 };
          for (const t of ALL_TYPES) {
            row[t] = Number(existing[t]) || 0;
          }
          row[type] = (row[type] || 0) + 1;
          for (const t of ALL_TYPES) {
            row.total += row[t];
          }
          return row;
        }
    id: runnerjs-bump-weekly-stat-27827c
    name: Bump weekly stat
    position:
      x: 3320
      "y": 260
    type: TYPE_ACTION
  - component: github.publishCommitStatus
    configuration:
      context: Semantic PR title
      description: '{{ $["Validate title"].data.result.reason }}'
      repository: "{{ root().data.repository.name }}"
      sha: "{{ root().data.pull_request.head.sha }}"
      state: failure
    id: publish-failure-status
    integration:
      id: 879eee5b-a973-4822-b4f2-0dc1df8b9680
    name: Publish failure status
    position:
      x: 2688
      "y": 744
    type: TYPE_ACTION
  - component: upsertMemory
    configuration:
      matchList:
      - name: week
        value: '{{ $["Bump weekly stat"].data.result.week }}'
      namespace: semanticPrWeeklyStats
      valueList:
      - name: week
        value: '{{ $["Bump weekly stat"].data.result.week }}'
      - name: total
        value: '{{ $["Bump weekly stat"].data.result.total }}'
      - name: feat
        value: '{{ $["Bump weekly stat"].data.result.feat }}'
      - name: fix
        value: '{{ $["Bump weekly stat"].data.result.fix }}'
      - name: docs
        value: '{{ $["Bump weekly stat"].data.result.docs }}'
      - name: chore
        value: '{{ $["Bump weekly stat"].data.result.chore }}'
      - name: invalid
        value: '{{ $["Bump weekly stat"].data.result.invalid }}'
    id: upsert-weekly-stat
    name: Upsert weekly stat
    position:
      x: 3960
      "y": 260
    type: TYPE_ACTION
  - component: filter
    configuration:
      expression: '{{ root().data.action == "closed" && root().data.pull_request.merged
        == true }}'
    id: filter-merged
    name: Merged PRs
    position:
      x: 1400
      "y": 260
    type: TYPE_ACTION
  - component: if
    configuration:
      expression: '{{ root().data.action == "opened" || root().data.action == "edited"
        }}'
    id: if-should-comment
    name: Should comment?
    position:
      x: 3312
      "y": 648
    type: TYPE_ACTION
  - component: github.createIssueComment
    configuration:
      body: |
        :x: This pull request title does not follow [semantic pull request](https://github.com/marketplace/actions/semantic-pull-request) conventions.

        **Title:** `{{ root().data.pull_request.title }}`

        **Reason:** {{ $["Validate title"].data.result.reason }}

        **Expected format:** `<type>: <description>` or `<type>(<scope>): <description>`

        **Allowed types:** {{ $["Validate title"].data.result.allowedTypesText }}

        **Examples:**
        - `feat: Add user authentication`
        - `fix: Handle timeout in webhook handler`
        - `docs: Update installation guide`
        - `chore: Bump dependencies`
      issueNumber: "{{ root().data.pull_request.number }}"
      repository: "{{ root().data.repository.name }}"
    id: comment-failure
    integration:
      id: c1da9632-de2c-4f04-bcfa-ce9bea0d1219
    name: Comment on PR
    position:
      x: 3960
      "y": 648
    type: TYPE_ACTION
  - component: start
    configuration:
      templates:
      - name: run
        parameters:
        - name: repository
          placeholder: e.g. github/octocat
          title: Repository
          type: string
        payload:
          repository: "{{ parameters.repository }}"
    id: trigger-setup
    name: Setup
    position:
      x: 120
      "y": 1260
    type: TYPE_TRIGGER
  - component: runnerJS
    configuration:
      enable_setup_commands: false
      execution_mode: host
      execution_timeout_seconds: 60
      machine_type: e1-tiny-amd64
      script: |
        function isoWeekNumber(isoDate) {
          const d = new Date(isoDate);
          const target = new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()));
          const dayNum = target.getUTCDay() || 7;
          target.setUTCDate(target.getUTCDate() + 4 - dayNum);
          const yearStart = new Date(Date.UTC(target.getUTCFullYear(), 0, 1));
          return Math.ceil((((target - yearStart) / 86400000) + 1) / 7);
        }

        function main() {
          const event = $["On Pull Request"].data || {};
          const mergedAt = event.pull_request?.merged_at || new Date().toISOString();
          const type = ($["Validate title"].data.result || {}).type || "invalid";

          return {
            week: isoWeekNumber(mergedAt),
            type: type,
          };
        }
    id: prepare-weekly-merge
    name: Prepare weekly merge
    position:
      x: 2040
      "y": 260
    type: TYPE_ACTION
  - component: upsertMemory
    configuration:
      itemVariable: weekStat
      iterateList: true
      listSource: $["Fetch weekly stats"].data.result.weeks
      matchList:
      - name: week
        value: weekStat.week
      namespace: semanticPrWeeklyStats
      valueList:
      - name: week
        value: weekStat.week
      - name: total
        value: weekStat.total
      - name: feat
        value: weekStat.feat
      - name: fix
        value: weekStat.fix
      - name: docs
        value: weekStat.docs
      - name: chore
        value: weekStat.chore
      - name: invalid
        value: weekStat.invalid
    id: import-weekly-stats
    isCollapsed: true
    name: Import weekly stats
    position:
      x: 1400
      "y": 1260
    type: TYPE_ACTION
  - component: if
    configuration:
      expression: '{{ root().data.action == "opened" || root().data.action == "edited"
        || root().data.action == "synchronize" }}'
    id: if-should-enforce
    name: Should enforce title?
    position:
      x: 1400
      "y": 620
    type: TYPE_ACTION
  - component: if
    configuration:
      expression: '{{ $["Validate title"].data.result.valid == true }}'
    id: if-title-valid
    name: Title valid?
    position:
      x: 2040
      "y": 620
    type: TYPE_ACTION
  - component: github.onPullRequest
    configuration:
      actions:
      - opened
      - synchronize
      - closed
      - edited
      repository: superplane
    id: trigger-on-pull-request
    integration:
      id: c1da9632-de2c-4f04-bcfa-ce9bea0d1219
    metadata:
      repository:
        id: 979560403.0
        name: superplane
        url: https://github.com/superplanehq/superplane
    name: On Pull Request
    position:
      x: 120
      "y": 456
    type: TYPE_TRIGGER
  - component: github.publishCommitStatus
    configuration:
      context: Semantic PR title
      description: Title is valid ({{ $["Validate title"].data.result.type }}).
      repository: "{{ root().data.repository.name }}"
      sha: "{{ root().data.pull_request.head.sha }}"
      state: success
    id: publish-success-status
    integration:
      id: 879eee5b-a973-4822-b4f2-0dc1df8b9680
    name: Publish success status
    position:
      x: 2688
      "y": 552
    type: TYPE_ACTION
  - component: runnerJS
    configuration:
      enable_setup_commands: false
      execution_mode: host
      execution_timeout_seconds: 60
      machine_type: e1-tiny-amd64
      script: |
        function main() {
          const event = $["On Pull Request"].data || {};
          const title = String(event.pull_request?.title || "").trim();
          const allowedTypes = [
            "feat", "fix", "docs", "chore",
          ];
          const typePattern = allowedTypes.join("|");
          const semanticPattern = new RegExp(
            "^(" + typePattern + ")(\\([a-z0-9._/-]+\\))?!?: .+$",
            "i",
          );

          if (!title) {
            return {
              valid: false,
              title,
              type: "invalid",
              reason: "Pull request title is empty.",
              allowedTypesText: allowedTypes.join(", "),
            };
          }

          if (!semanticPattern.test(title)) {
            return {
              valid: false,
              title,
              type: "invalid",
              reason:
                "Title must start with a semantic type (" +
                allowedTypes.join(", ") +
                ").",
              allowedTypesText: allowedTypes.join(", "),
            };
          }

          const match = title.match(new RegExp("^(" + typePattern + ")", "i"));
          return {
            valid: true,
            title,
            type: match ? match[1].toLowerCase() : "invalid",
            reason: "",
            allowedTypesText: allowedTypes.join(", "),
          };
        }
    id: validate-title
    name: Validate title
    position:
      x: 672
      "y": 456
    type: TYPE_ACTION
  - component: runnerJS
    configuration:
      enable_setup_commands: false
      environment:
      - name: GITHUB_TOKEN
        secret:
          key: token
          secret: app-semantic-pull-requests
        valueSource: secret
      execution_mode: host
      execution_timeout_seconds: 600
      machine_type: e1-tiny-amd64
      script: |
        const ALL_TYPES = [
          "feat", "fix", "docs", "chore", "invalid",
        ];
        const ALLOWED_TYPES = ALL_TYPES.slice(0, -1);
        const TYPE_PATTERN = new RegExp("^(" + ALLOWED_TYPES.join("|") + ")", "i");
        const SEMANTIC_PATTERN = new RegExp(
          "^(" + ALLOWED_TYPES.join("|") + ")(\\([a-z0-9._\\/-]+\\))?!?: .+$",
          "i",
        );

        function parseType(title) {
          const text = String(title || "").trim();
          if (!SEMANTIC_PATTERN.test(text)) {
            return "invalid";
          }
          const match = text.match(TYPE_PATTERN);
          return match ? match[1].toLowerCase() : "invalid";
        }

        function resolveRepository() {
          const setup = ($["Setup"] && $["Setup"].data) || {};
          const repository = String(setup.repository || "").trim();
          if (!repository) {
            throw new Error(
              "Provide a repository when running Setup (for example: owner/repo).",
            );
          }
          return repository;
        }

        function githubHeaders() {
          const headers = {
            Accept: "application/vnd.github+json",
            "Content-Type": "application/json",
            "X-GitHub-Api-Version": "2022-11-28",
          };
          if (process.env.GITHUB_TOKEN) {
            headers.Authorization = "Bearer " + process.env.GITHUB_TOKEN;
          }
          return headers;
        }

        async function githubGraphql(query, variables) {
          const response = await fetch("https://api.github.com/graphql", {
            method: "POST",
            headers: githubHeaders(),
            body: JSON.stringify({ query: query, variables: variables || {} }),
          });
          const body = await response.json();
          if (!response.ok) {
            throw new Error(
              "GitHub API error " + response.status + ": " + JSON.stringify(body),
            );
          }
          if (body.errors && body.errors.length > 0) {
            throw new Error("GitHub GraphQL error: " + JSON.stringify(body.errors));
          }
          return body.data;
        }

        function parseRepository(repository) {
          const slash = repository.indexOf("/");
          if (slash <= 0 || slash === repository.length - 1) {
            throw new Error("Repository must be in owner/repo format.");
          }
          return {
            owner: repository.slice(0, slash),
            repo: repository.slice(slash + 1),
          };
        }

        function isoWeekNumber(isoDate) {
          const d = new Date(isoDate);
          const target = new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()));
          const dayNum = target.getUTCDay() || 7;
          target.setUTCDate(target.getUTCDate() + 4 - dayNum);
          const yearStart = new Date(Date.UTC(target.getUTCFullYear(), 0, 1));
          return Math.ceil((((target - yearStart) / 86400000) + 1) / 7);
        }

        function createLogger() {
          const logs = [];
          return {
            logs: logs,
            info: function (message) {
              const line = String(message);
              console.log(line);
              logs.push(line);
            },
          };
        }

        async function fetchWeeklyStats(repository, logger) {
          const year = new Date().getFullYear();
          const since = year + "-01-01";
          const sinceMs = new Date(since + "T00:00:00Z").getTime();
          const parts = parseRepository(repository);
          const buckets = new Map();
          let total = 0;
          let cursor = null;
          let page = 0;
          const query = [
            "query($owner: String!, $name: String!, $cursor: String) {",
            "  repository(owner: $owner, name: $name) {",
            "    pullRequests(states: MERGED, first: 100, after: $cursor) {",
            "      pageInfo { hasNextPage endCursor }",
            "      nodes { title mergedAt }",
            "    }",
            "  }",
            "}",
          ].join("\n");

          logger.info("Fetching merged PRs for " + repository + " since " + since);

          while (true) {
            page += 1;
            logger.info("Requesting page " + page + " from GitHub GraphQL");

            const data = await githubGraphql(query, {
              owner: parts.owner,
              name: parts.repo,
              cursor: cursor,
            });
            const connection =
              data && data.repository && data.repository.pullRequests;
            const nodes = (connection && connection.nodes) || [];
            if (nodes.length === 0) {
              logger.info("Page " + page + " returned no merged PRs, stopping");
              break;
            }

            let pageCount = 0;
            for (const pr of nodes) {
              const mergedAt = pr.mergedAt;
              if (!mergedAt) {
                continue;
              }

              const mergedMs = new Date(mergedAt).getTime();
              if (mergedMs < sinceMs) {
                continue;
              }

              const week = isoWeekNumber(mergedAt);
              const type = parseType(pr.title);
              const key = week + "|" + type;
              buckets.set(key, (buckets.get(key) || 0) + 1);
              total += 1;
              pageCount += 1;
            }

            logger.info(
              "Page " +
                page +
                ": scanned " +
                nodes.length +
                " merged PRs, counted " +
                pageCount +
                " for " +
                year +
                " (running total: " +
                total +
                ")",
            );

            const pageInfo = connection && connection.pageInfo;
            if (!pageInfo || !pageInfo.hasNextPage) {
              logger.info("No more pages, finished fetching from GitHub");
              break;
            }

            cursor = pageInfo.endCursor;
            await new Promise(function (resolve) {
              setTimeout(resolve, 500);
            });
          }

          logger.info("Aggregating weekly statistics");

          const byWeek = new Map();
          for (const entry of buckets.entries()) {
            const key = entry[0];
            const count = entry[1];
            const separator = key.indexOf("|");
            const week = Number(key.slice(0, separator));
            const type = key.slice(separator + 1);
            if (!byWeek.has(week)) {
              const row = { week: week, total: 0 };
              for (const t of ALL_TYPES) {
                row[t] = 0;
              }
              byWeek.set(week, row);
            }
            const row = byWeek.get(week);
            row[type] = (row[type] || 0) + count;
            row.total += count;
          }

          const weeks = Array.from(byWeek.values());
          weeks.sort(function (a, b) {
            return a.week - b.week;
          });

          const payload = {
            total: total,
            weeks: weeks,
          };

          logger.info(
            "Done: " + weeks.length + " weeks with data, " + total + " merges in " + year,
          );
          logger.info("Payload: " + JSON.stringify(payload, null, 2));

          return {
            repository: repository,
            since: since,
            total: total,
            weeks: weeks,
            payload: payload,
            logs: logger.logs,
          };
        }

        function main() {
          const logger = createLogger();
          const repository = resolveRepository();
          logger.info("Setup started for repository " + repository);
          return fetchWeeklyStats(repository, logger);
        }
    id: fetch-weekly-stats
    name: Fetch weekly stats
    position:
      x: 760
      "y": 1260
    type: TYPE_ACTION
  - component: readMemory
    configuration:
      emitMode: allAtOnce
      matchList:
      - name: week
        value: '{{ $["Prepare weekly merge"].data.result.week }}'
      namespace: semanticPrWeeklyStats
      resultMode: latest
    id: read-weekly-stat
    name: Read weekly stat
    position:
      x: 2688
      "y": 240
    type: TYPE_ACTION
