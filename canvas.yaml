---
apiVersion: v1
kind: Canvas
metadata:
  id: 95fd1b27-f905-48cc-aff1-43972d5754db
  name: app-semantic-pull-requests
  description: Validate semantic pull request titles and track merged PRs by title
    type.
  isTemplate: false
spec:
  nodes:
  - id: if-title-valid
    name: Title valid?
    type: TYPE_ACTION
    component: if
    configuration:
      expression: '{{ $["Validate title"].data.result.valid == true }}'
    position:
      x: 2100
      "y": 320
    isCollapsed: false
    paused: false
  - id: publish-success-status
    name: Publish success status
    type: TYPE_ACTION
    component: github.publishCommitStatus
    configuration:
      repository: superplane
    position:
      x: 2760
      "y": 280
    isCollapsed: false
    integration:
      id: c1da9632-de2c-4f04-bcfa-ce9bea0d1219
    paused: false
  - id: fetch-merged-prs
    name: Fetch merged PRs
    type: TYPE_ACTION
    component: runnerJS
    configuration:
      enable_setup_commands: false
      environment:
      - name: GITHUB_TOKEN
        secret:
          key: token
          secret: app-semantic-pull-requests
        valueSource: secret
      execution_mode: host
      execution_timeout_seconds: 600
      machine_type: e1-tiny-arm64
      script: |
        const ALLOWED_TYPES = [
          "feat", "fix", "docs", "chore", "ci",
          "build", "test", "refactor", "perf", "style", "revert",
        ];
        const TYPE_PATTERN = new RegExp("^(" + ALLOWED_TYPES.join("|") + ")", "i");
        const SEMANTIC_PATTERN = new RegExp(
          "^(" + ALLOWED_TYPES.join("|") + ")(\\([a-z0-9._\\/-]+\\))?!?: .+$",
          "i",
        );

        function parseType(title) {
          const text = String(title || "").trim();
          if (!SEMANTIC_PATTERN.test(text)) {
            return "invalid";
          }
          const match = text.match(TYPE_PATTERN);
          return match ? match[1].toLowerCase() : "invalid";
        }

        function resolveRepository() {
          const setup = ($["Setup"] && $["Setup"].data) || {};
          const trigger = ($["On Pull Request"] && $["On Pull Request"].config) || {};
          const repository = String(setup.repository || trigger.repository || "").trim();
          if (!repository) {
            throw new Error(
              "Select a repository on the On Pull Request trigger before running Setup.",
            );
          }
          return repository;
        }

        async function githubFetch(url) {
          const headers = {
            Accept: "application/vnd.github+json",
            "X-GitHub-Api-Version": "2022-11-28",
          };
          if (process.env.GITHUB_TOKEN) {
            headers.Authorization = "Bearer " + process.env.GITHUB_TOKEN;
          }

          const response = await fetch(url, { headers });
          if (!response.ok) {
            throw new Error(
              "GitHub API error " + response.status + ": " + (await response.text()),
            );
          }
          return response.json();
        }

        async function fetchMergedPrs(repository) {
          const year = new Date().getFullYear();
          const since = year + "-01-01";
          const query = "repo:" + repository + " is:pr is:merged merged:>=" + since;
          const merges = [];
          let page = 1;

          while (true) {
            const url =
              "https://api.github.com/search/issues?q=" +
              encodeURIComponent(query) +
              "&per_page=100&page=" +
              page;
            const data = await githubFetch(url);
            const items = data.items || [];
            if (items.length === 0) {
              break;
            }

            for (const issue of items) {
              const mergedAt =
                issue.pull_request && issue.pull_request.merged_at
                  ? issue.pull_request.merged_at
                  : null;
              if (!mergedAt) {
                continue;
              }

              merges.push({
                pr_number: String(issue.number),
                repository: repository,
                title: String(issue.title || ""),
                type: parseType(issue.title),
                merged_at: String(Math.floor(new Date(mergedAt).getTime() / 1000)),
              });
            }

            const totalCount = Number(data.total_count || 0);
            if (items.length < 100 || merges.length >= totalCount) {
              break;
            }

            page += 1;
            await new Promise(function (resolve) {
              setTimeout(resolve, 2000);
            });
          }

          merges.sort(function (a, b) {
            return Number(a.merged_at) - Number(b.merged_at);
          });

          return {
            repository: repository,
            since: since,
            count: merges.length,
            merges: merges,
          };
        }

        function main() {
          const repository = resolveRepository();
          return fetchMergedPrs(repository);
        }
    position:
      x: 780
      "y": 520
    isCollapsed: true
    paused: false
  - id: import-historical-merges
    name: Import historical merges
    type: TYPE_ACTION
    component: upsertMemory
    configuration:
      itemVariable: merge
      iterateList: true
      listSource: $["Fetch merged PRs"].data.result.merges
      matchList:
      - name: pr_number
        value: merge.pr_number
      - name: repository
        value: merge.repository
      namespace: semanticPrMerges
      valueList:
      - name: pr_number
        value: merge.pr_number
      - name: repository
        value: merge.repository
      - name: title
        value: merge.title
      - name: type
        value: merge.type
      - name: merged_at
        value: merge.merged_at
    position:
      x: 1440
      "y": 520
    isCollapsed: true
    paused: false
  - id: if-should-enforce
    name: Should enforce title?
    type: TYPE_ACTION
    component: if
    configuration:
      expression: '{{ root().data.action == "opened" || root().data.action == "edited"
        || root().data.action == "synchronize" }}'
    position:
      x: 1440
      "y": 320
    isCollapsed: false
    paused: false
  - id: validate-title
    name: Validate title
    type: TYPE_ACTION
    component: runnerJS
    configuration:
      enable_setup_commands: false
      execution_mode: host
      execution_timeout_seconds: 60
      machine_type: e1-tiny-arm64
      script: |
        function main() {
          const event = $["On Pull Request"].data || {};
          const title = String(event.pull_request?.title || "").trim();
          const allowedTypes = [
            "feat", "fix", "docs", "chore", "ci",
            "build", "test", "refactor", "perf", "style", "revert",
          ];
          const typePattern = allowedTypes.join("|");
          const semanticPattern = new RegExp(
            "^(" + typePattern + ")(\\([a-z0-9._/-]+\\))?!?: .+$",
            "i",
          );

          if (!title) {
            return {
              valid: false,
              title,
              type: "invalid",
              reason: "Pull request title is empty.",
              allowedTypesText: allowedTypes.join(", "),
            };
          }

          if (!semanticPattern.test(title)) {
            return {
              valid: false,
              title,
              type: "invalid",
              reason:
                "Title must start with a semantic type (" +
                allowedTypes.join(", ") +
                ") followed by ': ' and a description.",
              allowedTypesText: allowedTypes.join(", "),
            };
          }

          const match = title.match(new RegExp("^(" + typePattern + ")", "i"));
          return {
            valid: true,
            title,
            type: match ? match[1].toLowerCase() : "invalid",
            reason: "",
            allowedTypesText: allowedTypes.join(", "),
          };
        }
    position:
      x: 780
      "y": 200
    isCollapsed: false
    paused: false
  - id: if-should-comment
    name: Should comment?
    type: TYPE_ACTION
    component: if
    configuration:
      expression: '{{ root().data.action == "opened" || root().data.action == "edited"
        }}'
    position:
      x: 3420
      "y": 400
    isCollapsed: false
    paused: false
  - id: record-pr-merge
    name: Record PR merge
    type: TYPE_ACTION
    component: upsertMemory
    configuration:
      matchList:
      - name: pr_number
        value: "{{ root().data.pull_request.number }}"
      - name: repository
        value: "{{ root().data.repository.full_name }}"
      namespace: semanticPrMerges
      valueList:
      - name: pr_number
        value: "{{ root().data.pull_request.number }}"
      - name: repository
        value: "{{ root().data.repository.full_name }}"
      - name: title
        value: "{{ root().data.pull_request.title }}"
      - name: type
        value: '{{ $["Validate title"].data.result.type }}'
      - name: merged_at
        value: "{{ int(now().Unix()) }}"
    position:
      x: 2100
      "y": 80
    isCollapsed: false
    paused: false
  - id: comment-failure
    name: Comment on PR
    type: TYPE_ACTION
    component: github.createIssueComment
    configuration:
      repository: superplane
    position:
      x: 4080
      "y": 400
    isCollapsed: false
    integration:
      id: c1da9632-de2c-4f04-bcfa-ce9bea0d1219
    paused: false
  - id: trigger-setup
    name: Setup
    type: TYPE_TRIGGER
    component: start
    configuration:
      templates:
      - name: run
        payload:
          repository: '{{ $["On Pull Request"].configuration.repository }}'
    position:
      x: 120
      "y": 520
    isCollapsed: false
    paused: false
  - id: if-merged
    name: Is merged?
    type: TYPE_ACTION
    component: if
    configuration:
      expression: '{{ root().data.action == "closed" && root().data.pull_request.merged
        == true }}'
    position:
      x: 1440
      "y": 80
    isCollapsed: false
    paused: false
  - id: trigger-on-pull-request
    name: On Pull Request
    type: TYPE_TRIGGER
    component: github.onPullRequest
    configuration:
      actions:
      - opened
      repository: superplane
    metadata:
      repository:
        id: 979560403
        name: superplane
        url: https://github.com/superplanehq/superplane
    position:
      x: 120
      "y": 200
    isCollapsed: false
    integration:
      id: c1da9632-de2c-4f04-bcfa-ce9bea0d1219
    paused: false
  - id: publish-failure-status
    name: Publish failure status
    type: TYPE_ACTION
    component: github.publishCommitStatus
    configuration:
      repository: superplane
    position:
      x: 2760
      "y": 400
    isCollapsed: false
    integration:
      id: c1da9632-de2c-4f04-bcfa-ce9bea0d1219
    paused: false
  edges:
  - sourceId: fetch-merged-prs
    targetId: import-historical-merges
    channel: passed
  - sourceId: if-merged
    targetId: record-pr-merge
    channel: 'true'
  - sourceId: if-should-comment
    targetId: comment-failure
    channel: 'true'
  - sourceId: if-should-enforce
    targetId: if-title-valid
    channel: 'true'
  - sourceId: if-title-valid
    targetId: publish-failure-status
    channel: 'false'
  - sourceId: if-title-valid
    targetId: publish-success-status
    channel: 'true'
  - sourceId: publish-failure-status
    targetId: if-should-comment
    channel: default
  - sourceId: trigger-on-pull-request
    targetId: validate-title
    channel: default
  - sourceId: trigger-setup
    targetId: fetch-merged-prs
    channel: default
  - sourceId: validate-title
    targetId: if-merged
    channel: passed
  - sourceId: validate-title
    targetId: if-should-enforce
    channel: passed
